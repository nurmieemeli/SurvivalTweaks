version: 2

# Every pull request opened here runs the full `verify` job: the Maven test
# suite plus the Paper smoke test, which enables the built JAR on a real server
# and fails on any error-level log line. A green check therefore means the
# upgrade actually starts, reloads, and shuts down cleanly.
#
# Two pinned versions are deliberately outside Dependabot's reach and still need
# a manual bump: the Paper server JAR and its checksum in
# .github/scripts/paper-smoke.ps1, and Paper's api-version in plugin.yml.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      # Drivers move together or not at all; a split upgrade is harder to judge
      # than one pull request covering the whole storage layer.
      storage:
        patterns:
          - com.zaxxer:HikariCP
          - org.xerial:sqlite-jdbc
          - org.postgresql:postgresql
          - com.mysql:mysql-connector-j
      test:
        patterns:
          - org.junit.jupiter:*
          - org.mockito:*
      maven-plugins:
        patterns:
          - org.apache.maven.plugins:*
    ignore:
      # paper-api tracks the Minecraft version the server actually runs, so it
      # is bumped alongside the smoke-test JAR rather than on Dependabot's
      # schedule. A stray minor bump here would silently retarget the plugin.
      - dependency-name: io.papermc.paper:paper-api
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    commit-message:
      prefix: ci
