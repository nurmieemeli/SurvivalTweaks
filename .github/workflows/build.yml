name: Build and release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: survivaltweaks_test
          POSTGRES_USER: survivaltweaks
          POSTGRES_PASSWORD: survivaltweaks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survivaltweaks -d survivaltweaks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: survivaltweaks_test
          MYSQL_USER: survivaltweaks
          MYSQL_PASSWORD: survivaltweaks
          MYSQL_ROOT_PASSWORD: survivaltweaks-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -usurvivaltweaks -psurvivaltweaks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        env:
          SURVIVALTWEAKS_POSTGRES_HOST: localhost
          SURVIVALTWEAKS_POSTGRES_PORT: '5432'
          SURVIVALTWEAKS_POSTGRES_DATABASE: survivaltweaks_test
          SURVIVALTWEAKS_POSTGRES_USERNAME: survivaltweaks
          SURVIVALTWEAKS_POSTGRES_PASSWORD: survivaltweaks
          SURVIVALTWEAKS_MYSQL_HOST: localhost
          SURVIVALTWEAKS_MYSQL_PORT: '3306'
          SURVIVALTWEAKS_MYSQL_DATABASE: survivaltweaks_test
          SURVIVALTWEAKS_MYSQL_USERNAME: survivaltweaks
          SURVIVALTWEAKS_MYSQL_PASSWORD: survivaltweaks
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Paper smoke test
        shell: pwsh
        run: ./.github/scripts/paper-smoke.ps1
      - name: Create checksum
        shell: bash
        run: |
          cd target
          jar="$(find . -maxdepth 1 -type f -name 'SurvivalTweaks-*.jar' -printf '%f\n')"
          test -n "$jar"
          sha256sum "$jar" > "$jar.sha256"
      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: SurvivalTweaks-${{ github.sha }}
          path: |
            target/SurvivalTweaks-*.jar
            target/SurvivalTweaks-*.jar.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: SurvivalTweaks-${{ github.sha }}
          path: release
      - name: Validate tag and checksum
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          test -f "release/SurvivalTweaks-${expected}.jar"
          cd release
          sha256sum --check "SurvivalTweaks-${expected}.jar.sha256"
      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/SurvivalTweaks-*.jar \
            release/SurvivalTweaks-*.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SurvivalTweaks ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest
