config-version: 4

home:
  max-amount: 3

# Adaptive load shedding only changes cosmetic cadence and spreads batchable work.
# Teleport safety, container locks, persistence, and other correctness paths are never throttled.
performance:
  enabled: true
  reduced-mspt: 40.0
  critical-mspt: 47.0
  recovery-mspt: 32.0
  recovery-seconds: 15
  work-budget-per-tick: 256

teleport:
  request-lifetime-seconds: 30
  warmup-seconds: 3
  cooldown-seconds: 30
  cancel-on-move: true
  cancel-on-damage: true
  # Teleporting with a container open lets a modified client desynchronise its
  # contents from the server, which duplicates items. Refuse to start or finish
  # a teleport while one is open. SurvivalTweaks' own menus are exempt because
  # they hold nothing a player can take.
  cancel-on-inventory-open: true
  safe-search-radius: 4

# First-time players receive a unique, safe Overworld starting location.
# Prepared locations remain generated and loaded so joins do not wait on terrain.
new-player-spawn:
  enabled: true
  # Leave blank to use the server's first loaded Overworld.
  world: ""
  min-x: -25000
  max-x: 25000
  min-z: -25000
  max-z: 25000
  preload-locations: 10
  minimum-separation: 256
  max-generation-attempts: 100
  # Pace terrain generation and pause it when the one-minute TPS falls below this value.
  generation-delay-ticks: 20
  minimum-tps: 18.0
  # Every block in this radius must be safe and reasonably level.
  landing-radius: 2
  max-height-variation: 2
  # Empty allow list means every biome not present in blocked-biomes.
  allowed-biomes: []
  blocked-biomes:
    - "minecraft:ocean"
    - "minecraft:deep_ocean"
    - "minecraft:frozen_ocean"
    - "minecraft:deep_frozen_ocean"
    - "minecraft:cold_ocean"
    - "minecraft:deep_cold_ocean"
    - "minecraft:lukewarm_ocean"
    - "minecraft:deep_lukewarm_ocean"
    - "minecraft:warm_ocean"

storage:
  autosave-seconds: 300
  # Remote databases are also exported to verified, portable SQLite snapshots.
  # SQLite already lives in the regular safety backup and does not need this job.
  portable-exports:
    enabled: true
    interval-hours: 24
    initial-delay-minutes: 5
    retention: 7
  # auto uses SQLite unless a remote type is configured. Once initialized,
  # the selected endpoint is pinned and can only change through a migration.
  backend: auto
  sqlite:
    file: "survivaltweaks.db"
  remote:
    # Leave blank for SQLite. Supported values: postgresql, mysql.
    type: ""
    host: "localhost"
    # 0 selects the engine default: PostgreSQL 5432 or MySQL 3306.
    port: 0
    database: "survivaltweaks"
    # PostgreSQL only. Existing schema-v2 configs migrate to public so current
    # data stays visible; fresh installations use this dedicated schema.
    postgresql-schema: "survivaltweaks"
    username: "survivaltweaks"
    password: ""
    # MySQL TLS toggle. PostgreSQL uses the explicit mode below.
    ssl: true
    # verify-full validates both the certificate chain and server hostname.
    # Other pgjdbc modes: disable, allow, prefer, require, verify-ca.
    postgresql-ssl-mode: "verify-full"
    pool-size: 4
    connection-timeout-millis: 5000
    # Bound stalled network operations and statements so shutdown cannot hang forever.
    socket-timeout-seconds: 30
    query-timeout-seconds: 30

locked-containers:
  target-distance: 5
  max-per-player: 100
  protect-from-explosions: true
  block-automation: true
  purge-inactive-days: 0

tree-feller:
  # Felling I always requires sneaking; this caps work performed by one tree.
  max-blocks: 128

fast-leaf-decay:
  enabled: true
  decay-delay-ticks: 2
  radius: 5

pet-protection:
  enabled: true
  prevent-friendly-fire: true

hotbar-refill:
  enabled: true

decoration-protection:
  enabled: true
  require-sneak-to-break: true

atmosphere:
  durability-warning: true
  low-health-heartbeat: true
  ambient-effects: true
  rare-pickup-effects: true
  shield-block-effects: true
  death-site-wisps: true
  advancement-effects: true
  thunder-effects: true
  cave-echoes: true
  totem-glow: true
  ender-chest-effects: true
  arrow-trails: true
  sprint-dust: true
  anvil-sparks: true
  drowning-gasp: true
  nether-soul-embers: true
  spyglass-effects: true
  deep-dark-spores: true
  sculk-warning-actionbar: true

ui:
  # Multiple homes open in a safe, paginated chest-style menu.
  home-menu-enabled: true
  # Paper's dialog API is experimental; commands remain available as fallbacks.
  dialogs-enabled: true
  # Teleport timers, cooldowns, and container targeting hints use the action bar.
  action-bar-enabled: true
  lock-target-hints-enabled: true

death-recovery:
  enabled: true
  floating-guide:
    # Private, non-persistent text display that automatically returns after
    # respawning or rejoining while a death marker remains active.
    enabled: true
    # Inside this distance, the display moves onto the exact death location.
    near-distance: 32.0
    # While farther away, keep the directional display this many blocks away.
    offset: 3.5
  marker-lifetime-seconds: 3600

# Subtle localized alternatives for environmental deaths. Deaths attributed to
# players, mobs, projectiles, or other entities always retain Minecraft's native
# killer and weapon-aware message.
custom-death-messages:
  enabled: true
  # Rare lines are a little more playful; set to 0 for only restrained variants.
  rare-variant-percent: 5
  causes:
    fall: true
    fire: true
    drowning: true
    suffocation: true
    void: true
    freezing: true
    starvation: true
    lightning: true
    contact: true
    explosion: true
    world-border: true
    cramming: true

feedback:
  enabled: true
  sounds-enabled: true
  particles-enabled: true
  # Sound values are Minecraft sound keys. Particle values use Bukkit names.
  cues:
    home-saved:
      sound: "minecraft:entity.player.levelup"
      volume: 0.65
      pitch: 1.35
      particle: "HAPPY_VILLAGER"
