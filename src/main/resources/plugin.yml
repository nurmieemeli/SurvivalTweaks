name: SurvivalTweaks
version: '${project.version}'
main: gg.nurmi.survivaltweaks.SurvivalTweaks
website: https://github.com/nurmieemeli/SurvivalTweaks
api-version: '26.2'

# Command descriptions and usage strings are deliberately absent. Bukkit stores
# one server-wide string per command and cannot localize them, so SurvivalTweaks
# feeds both from the language catalogs at startup instead of duplicating them
# here. See command.usage.* and admin.help.* in messages_en.yml.
commands:
  afk:
    aliases: [away, poissa]
    permission: survivaltweaks.command.afk
  mail:
    aliases: [post, posti]
    permission: survivaltweaks.command.mail
  profile:
    aliases: [playerprofile, profiili]
    permission: survivaltweaks.command.profile
  stats:
    aliases: [statistics, tilastot]
    permission: survivaltweaks.command.stats
  welcome:
    aliases: [welcomeback, takaisin]
    permission: survivaltweaks.command.welcome
  guide:
    aliases: [vanillaguide, opas]
    permission: survivaltweaks.command.guide
  deathlocation:
    aliases: [deathloc, kuolinpaikka]
    permission: survivaltweaks.command.deathlocation
  teleportinbox:
    aliases: [tpinbox, tprequests]
    permission: survivaltweaks.command.teleportaccept
  survivaltweaks:
    aliases: [st, stweaks, survival]
  sethome:
    aliases: [asetakoti, homeset]
    permission: survivaltweaks.command.sethome
  deletehome:
    aliases: [poistakoti, homedelete, removehome, homeremove]
    permission: survivaltweaks.command.deletehome
  home:
    aliases: [koti, homes, kodit]
    permission: survivaltweaks.command.home
  teleport:
    aliases: [tp, tpa, tele, teleportti]
    permission: survivaltweaks.command.teleport
  teleportaccept:
    aliases: [tpaccept, hyväksy, accept]
    permission: survivaltweaks.command.teleportaccept
  shout:
    aliases: []
    permission: survivaltweaks.command.shout
  lock:
    aliases: [lukitse]
    permission: survivaltweaks.command.lock
  unlock:
    aliases: [poistalukko]
    permission: survivaltweaks.command.unlock

permissions:
  survivaltweaks.command.afk:
    description: Allows manually toggling the player-list AFK indicator.
    default: true
  survivaltweaks.command.mail:
    description: Allows using text-only player mail.
    default: true
  survivaltweaks.command.profile:
    description: Allows viewing player profiles.
    default: true
  survivaltweaks.command.stats:
    description: Allows viewing vanilla player statistics.
    default: true
  survivaltweaks.command.welcome:
    description: Allows opening the welcome-back summary.
    default: true
  survivaltweaks.command.guide:
    description: Allows opening the contextual vanilla guide.
    default: true
  survivaltweaks.profile.bypass:
    description: Allows viewing player profiles and statistics hidden by their owners.
    default: op
  survivaltweaks.command.deathlocation:
    description: Allows viewing a death marker and managing its private guide.
    default: true
  survivaltweaks.command.reload:
    description: Allows safely reloading SurvivalTweaks configuration and languages.
    default: op
  survivaltweaks.command.doctor:
    description: Allows running SurvivalTweaks data and configuration diagnostics.
    default: op
  survivaltweaks.command.performance:
    description: Allows inspecting adaptive performance and deferred work status.
    default: op
  survivaltweaks.command.spawnpool:
    description: Allows inspecting and managing the new-player spawn pool.
    default: op
  survivaltweaks.command.backup:
    description: Allows creating, verifying, and staging restoration of SurvivalTweaks backups.
    default: op
  survivaltweaks.command.maintenance:
    description: Allows managing maintenance mode and safe restart countdowns.
    default: op
  survivaltweaks.command.enchant:
    description: Allows creating custom enchanted books for testing and administration.
    default: op
  survivaltweaks.maintenance.bypass:
    description: Allows joining during manual maintenance mode.
    default: op
  survivaltweaks.command.home:
    description: Allows using /home.
    default: true
  survivaltweaks.command.sethome:
    description: Allows using /sethome.
    default: true
  survivaltweaks.command.deletehome:
    description: Allows using /deletehome.
    default: true
  survivaltweaks.command.teleport:
    description: Allows using /teleport.
    default: true
  survivaltweaks.command.teleportaccept:
    description: Allows using /teleportaccept.
    default: true
  survivaltweaks.command.shout:
    description: Allows using /shout.
    default: op
  survivaltweaks.teleport.bypass:
    description: Skips the teleport request and teleports immediately.
    default: op
  survivaltweaks.teleport.instant:
    description: Skips the teleport warm-up delay.
    default: op
  survivaltweaks.command.lock:
    description: Allows locking containers and managing their access.
    default: true
  survivaltweaks.command.unlock:
    description: Allows removing your own container locks.
    default: true
  survivaltweaks.lock.admin:
    description: Allows using and managing every container lock.
    default: op
