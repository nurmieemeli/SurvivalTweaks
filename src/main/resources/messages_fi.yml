# Finnish messages. MiniMessage formatting is supported.
player-only: "<red>Tätä komentoa voi käyttää vain pelaajana.</red>"
chat-format: "<gray><name></gray><dark_gray>: </dark_gray><white><message></white>"

# Jaetut yksikkömuotoilut, käytetään kaikkialla missä näytetään kesto tai matka.
format:
  duration:
    days-hours: "<days> pv <hours> t"
    hours-minutes: "<hours> t <minutes> min"
    days: "<days> pv"
    hours: "<hours> t"
    minutes: "<minutes> min"
  distance:
    kilometres: "<value> km"
    metres: "<value> m"

# Syötetään Bukkitin komentotietoihin käynnistyksessä; näkyy /help-komennossa.
# Bukkit säilyttää yhden palvelinkohtaisen merkkijonon komentoa kohti, joten
# nämä luetaan vain englanninkielisestä luettelosta.
command:
  usage:
    afk: "/afk"
    mail: "/mail [inbox|send|block|unblock] [pelaaja] [viesti]"
    profile: "/profile [pelaaja]"
    stats: "/stats [pelaaja]"
    welcome: "/welcome"
    guide: "/guide"
    deathlocation: "/deathlocation [info|guide [on|off]|dismiss]"
    teleportinbox: "/teleportinbox"
    survivaltweaks: "/survivaltweaks [help|reload|doctor|performance|backup|spawnpool|maintenance|restart]"
    sethome: "/sethome [nimi]"
    deletehome: "/deletehome [nimi]"
    home: "/home [nimi|omistaja:nimi|invite koti pelaaja|uninvite koti pelaaja]"
    teleport: "/teleport <pelaaja>"
    teleportaccept: "/teleportaccept [pelaaja]"
    shout: "/shout <viesti>"
    lock: "/lock [trust|untrust|transfer|info|nearby] [pelaaja|säde]"
    unlock: "/unlock [confirm]"

connection:
  join: "<green><player> liittyi.</green>"
