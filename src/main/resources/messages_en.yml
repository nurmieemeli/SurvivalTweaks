# English fallback messages. MiniMessage formatting is supported.
player-only: "<red>This command can only be used by a player.</red>"
chat-format: "<gray><name></gray><dark_gray>: </dark_gray><white><message></white>"
chat-player-hover: "<green><player></green>\n<gray>Click to open profile\nTeleport: /teleport <player>\nMail: /mail send <player> ...</gray>"

recovery:
  retry: "<aqua>[Correct command]</aqua>"
  open-homes: "<aqua>[Open homes]</aqua>"
  create-home: "<aqua>[Create a home]</aqua>"
  open-inbox: "<aqua>[Open requests]</aqua>"
  inspect-lock: "<aqua>[Inspect lock]</aqua>"
  open-hub: "<aqua>[Open Survival]</aqua>"
  show-help: "<aqua>[Show help]</aqua>"

# Shared unit formatting, used wherever a duration or distance is shown.
format:
  duration:
    days-hours: "<days>d <hours>h"
    hours-minutes: "<hours>h <minutes>m"
    days: "<days>d"
    hours: "<hours>h"
    minutes: "<minutes>m"
  distance:
    kilometres: "<value> km"
    metres: "<value> m"

# Fed into Bukkit's command metadata at startup and shown by vanilla /help.
# Bukkit holds one server-wide string per command, so these are read from this
# catalog only; per-player usage text comes from the <command>.usage keys.
command:
  usage:
    afk: "/afk"
    mail: "/mail [inbox|send|block|unblock] [player] [message]"
    profile: "/profile [player]"
    stats: "/stats [player]"
    welcome: "/welcome"
    guide: "/guide"
    deathlocation: "/deathlocation [info|guide [on|off]|dismiss]"
    teleportinbox: "/teleportinbox"
    survivaltweaks: "/survivaltweaks [help|reload|doctor|performance|backup|spawnpool|maintenance|restart]"
    sethome: "/sethome [name]"
    deletehome: "/deletehome [name]"
    home: "/home [name|owner:name|invite home player|uninvite home player]"
    teleport: "/teleport <player>"
    teleportaccept: "/teleportaccept [player]"
    shout: "/shout <message>"
    lock: "/lock [trust|untrust|transfer|info|nearby] [player|radius]"
    unlock: "/unlock [confirm]"

connection:
  join: "<green><player> joined.</green>"
  quit: "<red><player> left.</red>"

player-list:
  header: "<dark_green><bold>Survival</bold></dark_green>\n<gray><greeting>, <white><player></white></gray>"
  greeting:
    morning: "Good morning"
    day: "Good afternoon"
    evening: "Good evening"
    night: "Good night"
  online: "<gray><online>/<maximum> online</gray>"
  online-with-afk: "<gray><online>/<maximum> online</gray> <dark_gray>•</dark_gray> <green><active> active</green> <dark_gray>•</dark_gray> <yellow><afk> AFK</yellow>"
  ping: "<gray>Ping <ping> ms</gray>"
  tps: "<gray>TPS <tps></gray>"
  mspt: "<gray>MSPT <mspt> ms</gray>"
  time: "<gray><time></gray>"
  weather:
    clear: "<yellow>Clear</yellow>"
    rain: "<aqua>Rain</aqua>"
    thunder: "<red>Thunder</red>"
  unread: "<yellow><count> unread notifications</yellow>"
  unread-one: "<yellow><count> unread notification</yellow>"
  entry: "<gray><player></gray><afk>"
  afk-marker: " <yellow>[AFK]</yellow>"
  world:
    overworld: "<green>Overworld</green>"
    nether: "<red>Nether</red>"
    end: "<light_purple>The End</light_purple>"
    custom: "<aqua><world></aqua>"

afk:
  enabled: "<yellow>You are now marked AFK. Move or interact to return.</yellow>"
  disabled: "<green>You are no longer marked AFK.</green>"
  unavailable: "<red>AFK indicators are disabled on this server.</red>"

updates:
  available: "<gold>SurvivalTweaks <latest> is available.</gold> <gray>This server is running <current>.</gray> <link>"
  open-hover: "<gray>Download the verified release JAR from GitHub.</gray>"

sleep:
  progress: "<aqua>Sleeping: <white><sleeping>/<required></white> active players</aqua>"
  skipped: "<yellow>Enough active players slept. Good morning!</yellow>"

server-list:
  motd: "<dark_green><bold>Survival</bold></dark_green> <dark_gray>•</dark_gray> <status>\n<announcement>"
  status:
    online: "<green>Online</green>"
    maintenance: "<yellow>Maintenance</yellow>"
    restarting: "<red>Restarting</red>"
    # <time> is an abbreviation (e.g. "5m"), so this stays a label rather than
    # a sentence — Finnish cannot govern an abbreviation with a postposition.
    restart-scheduled: "<yellow>Restart scheduled: <time></yellow>"

mentions:
  target-afk: "<yellow><player> is currently AFK and may not respond immediately.</yellow>"

maintenance:
  join-blocked: "<yellow>The server is currently in maintenance mode. Please try again soon.</yellow>"
  restart-join-blocked: "<yellow>The server is restarting shortly. Please reconnect in a moment.</yellow>"
  restart-warning: "<yellow>Server restart in <red><time></red>.</yellow>"
  restart-bossbar: "<red>Server restart</red> <dark_gray>•</dark_gray> <white><time></white>"
  restart-kick: "<yellow>The server is restarting safely. Please reconnect in a moment.</yellow>"
  duration:
    second: "<count> second"
    seconds: "<count> seconds"
    minute: "<count> minute"
    minutes: "<count> minutes"
    hour: "<count> hour"
    hours: "<count> hours"
    # Used before a preposition such as "in". English needs no separate case,
    # but languages like Finnish inflect the noun here.
    second-before: "<count> second"
    seconds-before: "<count> seconds"
    minute-before: "<count> minute"
    minutes-before: "<count> minutes"
    hour-before: "<count> hour"
    hours-before: "<count> hours"

